<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>reservAR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0c061a;color:#fff;display:flex;flex-direction:column;align-items:center}
nav{width:95%;max-width:1300px;margin:12px auto;padding:10px 14px;background:rgba(40,20,70,.6);border-radius:14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:12px;z-index:50}
.sec{width:95%;max-width:1300px;display:none;flex-direction:column;align-items:center}
.sec.active{display:flex}
.card{border-radius:18px;padding:14px;cursor:pointer;flex:1;min-width:280px}
.img-wrap{height:170px;position:relative;border-radius:12px;overflow:hidden;background:#0003}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:.6s}
.slide.active{opacity:1}
.c-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:.6s}
.c-slide.active{opacity:1}
</style>
</head>
<body>
<nav><div>reservAR <span id="locCount" style="font-size:10px;background:#7c3aed;padding:2px 6px;border-radius:8px"></span></div><div><span onclick="showTab('inicio')">Inicio</span> <span onclick="showTab('planes')">Planes</span> <span onclick="showTab('contacto')">Contacto</span> <button onclick="openLogin()">Login</button></div></nav>
<div id="sec-inicio" class="sec active">
<div style="display:flex;gap:14px;width:100%;flex-wrap:wrap;padding:12px 0">
<div class="card" style="background:linear-gradient(135deg,#7c3aed,#4f2bd9)" onclick="redir('local')">
<div id="wrap-locales" class="img-wrap">
<img class="slide active" src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=600">
<img class="slide" src="https://images.unsplash.com/photo-1560066984-138dadb4c035?w=600">
<img class="slide" src="https://images.unsplash.com/photo-1521590832167-7bcbfaa2b355?w=600">
</div>
<button onclick="event.stopPropagation();redir('local')">Soy Local</button>
</div>
<div class="card" style="background:#93c5fd;color:#1e1b4b" onclick="redir('cliente')">
<div id="wrap-clientes" class="img-wrap">
<img class="slide active" src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=600">
<img class="slide" src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=600">
<img class="slide" src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?w=600">
</div>
<button onclick="event.stopPropagation();redir('cliente')">Soy Cliente</button>
</div>
</div>
<div id="premium-container" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;font-size:11px;color:#b8a0ff"></div>
</div>
<div id="sec-planes" class="sec">
<div style="text-align:center;padding:16px 0"><h2>Planes</h2><div style="background:#fde047;color:#422006;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;margin-top:8px;display:inline-block">⭐ 20% OFF - 38/50 cupos restantes - $100 tachado -> $50</div></div>
<div id="plans-container" style="display:flex;gap:12px;flex-wrap:wrap;width:100%;justify-content:center"></div>
</div>
<div id="sec-contacto" class="sec">
<div style="background:#1a1040;border-radius:18px;padding:18px;width:100%;text-align:center;margin-top:12px">
<h2>Contacto</h2>
<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
<div style="background:rgba(255,255,255,.08);padding:10px;border-radius:10px;display:flex;justify-content:space-between"><span>WhatsApp</span><a id="c-wsp" href="#" style="color:#fde047;font-weight:700"></a></div>
<div style="background:rgba(255,255,255,.08);padding:10px;border-radius:10px;display:flex;justify-content:space-between"><span>Email</span><a id="c-email" href="#" style="color:#fde047;font-weight:700"></a></div>
</div>
<p style="font-size:9px;color:#a78bfa;margin-top:10px">Alias y CBU solo visibles en panel ADM privado, nunca en landing</p>
</div>
</div>
<footer id="f-text" style="text-align:center;padding:12px;font-size:9px;color:#a78bfa;margin:12px auto;width:95%;max-width:1300px"></footer>
<div id="modalLogin" style="position:fixed;inset:0;background:rgba(5,2,15,.8);display:none;place-items:center;z-index:100" onclick="if(event.target==this)closeLogin()">
<div style="background:#1a1040;padding:20px;border-radius:20px;width:95%;max-width:340px;text-align:center">
<button style="width:100%;padding:12px;border-radius:12px;border:none;font-weight:800;background:#7c3aed;color:#fff;margin-bottom:8px" onclick="redir('local')">🏪 SOY LOCAL</button>
<button style="width:100%;padding:12px;border-radius:12px;border:none;font-weight:800;background:#bfdbfe;color:#1e40af" onclick="redir('cliente')">👤 SOY CLIENTE</button>
<button onclick="closeLogin()" style="margin-top:8px;background:transparent;color:#a78bfa;border:1px solid rgba(255,255,255,.15);padding:6px 12px;border-radius:10px">Cerrar</button>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyC57wshaJ2EuIBoBdXv18opL4u_Vuw2bAQ",authDomain:"reservar-cb70d.firebaseapp.com",projectId:"reservar-cb70d",storageBucket:"reservar-cb70d.appspot.com"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
// COORDINACION REAL - NO ROMPE EN /res/
function redir(tipo,plan){
 const base='./'; const dest=tipo==='local'? base+'local.html' : base+'cliente.html';
 const src=new URLSearchParams(location.search).get('src')||'landing';
 let url=`${dest}?src=${encodeURIComponent(src)}`;
 if(plan) url+=`&plan=${encodeURIComponent(plan)}`;
 location.href=url;
}
function redirClienteConLocal(id){
 const src=new URLSearchParams(location.search).get('src')||'landing';
 location.href=`./cliente.html?local=${encodeURIComponent(id)}&src=${encodeURIComponent(src)}`;
}
function showTab(n){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active')); document.getElementById('sec-'+n).classList.add('active');}
function openLogin(){document.getElementById('modalLogin').style.display='grid'} function closeLogin(){document.getElementById('modalLogin').style.display='none'}
// CARRUSELES ARREGLADOS - CON ESPACIO
let iv1,iv2;
function initSliders(){
 const s1=document.querySelectorAll('#wrap-locales .slide');
 const s2=document.querySelectorAll('#wrap-clientes .slide');
 if(iv1) clearInterval(iv1); if(iv2) clearInterval(iv2);
 let i1=0,i2=0;
 if(s1.length>1) iv1=setInterval(()=>{s1[i1].classList.remove('active'); i1=(i1+1)%s1.length; s1[i1].classList.add('active');},3000);
 if(s2.length>1) iv2=setInterval(()=>{s2[i2].classList.remove('active'); i2=(i2+1)%s2.length; s2[i2].classList.add('active');},3200);
}
// PLANES CON FALLBACK Y CUPO COMPARTIDO
const CUPO_PROMO=38; const CUPO_TOTAL=50; const PRECIO_TACHADO=100; const PRECIO_PROMO=50;
db.collection('config').doc('general').onSnapshot(d=>{
 const data=d.data()||{}; if(data.mantenimiento){document.getElementById('mant')&&(document.getElementById('mant').style.display='block');}
});
db.collection('config').doc('landing').onSnapshot(d=>{
 const l=d.data()||{}; document.getElementById('f-text').textContent=l.footer||'© reservAR 2026';
 if(l.contacto){document.getElementById('c-wsp').textContent=l.contacto.wsp||''; document.getElementById('c-wsp').href='https://wa.me/'+(l.contacto.wsp||'').replace(/\D/g,''); document.getElementById('c-email').textContent=l.contacto.email||''; document.getElementById('c-email').href='mailto:'+(l.contacto.email||'');}
});
db.collection('config').doc('planes').onSnapshot(d=>{
 const planes=d.data()||{}; const cont=document.getElementById('plans-container'); if(!cont) return; cont.innerHTML='';
 ['casa','base','medio','premium'].forEach(k=>{
  const p=planes[k]; if(!p) return;
  const tach=p.tachado||PRECIO_TACHADO; const prec=p.precio||PRECIO_PROMO; const isRec=k==='medio'; const isCasa=k==='casa';
  cont.innerHTML+=`<div style="background:${isRec?'#2e1a8a':isCasa?'#f0fdf4':'#fff'};color:${isRec?'#fff':'#1e1b4b'};border-radius:16px;padding:16px;flex:1;min-width:260px;text-align:center;position:relative;border:${isRec?'2px solid #fde047':isCasa?'2px solid #22c55e':'none'}">
  <div style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:${isCasa?'#22c55e':'#fde047'};color:${isCasa?'#fff':'#422006'};font-size:9px;font-weight:800;padding:2px 8px;border-radius:10px">${CUPO_PROMO}/${CUPO_TOTAL} CUPOS</div>
  <h3 style="margin-top:6px">${k.toUpperCase()}</h3>
  <div style="text-decoration:line-through;opacity:.5;font-size:12px">$${tach}</div><div style="font-size:28px;font-weight:800">$${prec}<small style="font-size:12px">/${isCasa?'reserva':'mes'}</small></div>
  <button onclick="redir('local','${k}')" style="width:100%;margin-top:10px;padding:10px;border-radius:10px;border:none;font-weight:800;background:${isRec?'#7c3aed':'#1e1b4b'};color:#fff;cursor:pointer">${isCasa?'Probar Casa':'Elegir '+k}</button>
  </div>`;
 });
});
db.collection('locales').where('estado','==','aprobado').onSnapshot(snap=>{
 const cont=document.getElementById('premium-container'); if(!cont) return; cont.innerHTML=''; let c=0;
 snap.forEach(doc=>{ const l=doc.data(); if(!l.apareceEnLanding) return; c++; cont.innerHTML+=`<div onclick="redirClienteConLocal('${doc.id}')" style="background:rgba(255,255,255,.08);padding:8px;border-radius:10px;cursor:pointer"><b>${l.nombre||'Local'}</b><br>${l.barrio||''}</div>`; });
 document.getElementById('locCount').textContent=c?c+' locales':'';
});
window.addEventListener('load',initSliders);
</script>
</body>
</html>
