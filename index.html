<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WETR - Landing</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #111;
  }
  .img-wrap {
    position: relative;
    width: 100%;
    height: 420px;
    overflow: hidden;
    border-radius: 24px;
    background: var(--card);
  }
  /* FIX 1: con espacio .img-wrap .slide */
  .img-wrap .slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .6s ease;
  }
  /* FIX 2: con espacio .img-wrap .slide.active */
  .img-wrap .slide.active {
    opacity: 1;
  }
  .como-carousel {
    position: relative;
    min-height: 140px;
    margin-top: 20px;
  }
  /* FIX 3 y 4: con espacio */
  .como-carousel .c-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .6s ease;
  }
  .como-carousel .c-slide.active {
    opacity: 1;
  }
</style>
</head>
<body>
  <section id="locales">
    <div class="img-wrap" id="wrap-locales">
      <img class="slide active" id="img-l1" src="" alt="" />
      <img class="slide" id="img-l2" src="" alt="" />
      <img class="slide" id="img-l3" src="" alt="" />
    </div>
    <div class="como-carousel" id="como-carousel-local">
      <div class="c-slide active"><h3>Texto 1 Local</h3></div>
      <div class="c-slide"><h3>Texto 2 Local</h3></div>
      <div class="c-slide"><h3>Texto 3 Local</h3></div>
    </div>
  </section>
    <section id="clientes">
    <div class="img-wrap" id="wrap-clientes">
      <img class="slide active" id="img-c1" src="" alt="" />
      <img class="slide" id="img-c2" src="" alt="" />
      <img class="slide" id="img-c3" src="" alt="" />
    </div>
    <div class="como-carousel" id="como-carousel-cliente">
      <div class="c-slide active"><h3>Texto 1 Cliente</h3></div>
      <div class="c-slide"><h3>Texto 2 Cliente</h3></div>
      <div class="c-slide"><h3>Texto 3 Cliente</h3></div>
    </div>
  </section>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // FIX 5: con espacio #wrap-locales.slide
  const s1 = document.querySelectorAll('#wrap-locales.slide');
  const t1 = document.querySelectorAll('#como-carousel-local.c-slide');
  let idx1 = 0;
  function tick1() {
    if (!s1.length) return;
    s1[idx1].classList.remove('active');
    t1[idx1].classList.remove('active');
    idx1 = (idx1 + 1) % s1.length;
    s1[idx1].classList.add('active');
    t1[idx1].classList.add('active');
  }
  setInterval(tick1, 4000);
    // FIX 6 y 7: con espacio
  const s2 = document.querySelectorAll('#wrap-clientes.slide');
  const t2 = document.querySelectorAll('#como-carousel-cliente.c-slide');
  let idx2 = 0;
  function tick2() {
    if (!s2.length) return;
    s2[idx2].classList.remove('active');
    t2[idx2].classList.remove('active');
    idx2 = (idx2 + 1) % s2.length;
    s2[idx2].classList.add('active');
    t2[idx2].classList.add('active');
  }
  setInterval(tick2, 4000);

  // galeriaLocales de Firebase - queda igual, no se toca
  const galeriaLocales = window.galeriaLocales || [];
  if (galeriaLocales[0]) {
    document.getElementById('img-l1').src = galeriaLocales[0];
    document.getElementById('img-l2').src = galeriaLocales[1] || galeriaLocales[0];
    document.getElementById('img-l3').src = galeriaLocales[2] || galeriaLocales[0];
  }
});
</script>
</body>
</html>
