<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva - Landing</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.slider { overflow: hidden; position: relative; }
.slider.track { display: flex; transition: transform 0.5s ease; }
.slider.slide { min-width: 100%; box-sizing: border-box; padding: 10px; }
.slider.slide img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; }
.btn { background: #111; color: #fff; padding: 10px 18px; border-radius: 10px; }
.btn:hover { opacity: 0.9; }
</style>
</head>
<body class="bg-gray-50">
<header class="p-4 flex justify-between items-center bg-white shadow">
<h1 class="font-bold text-xl">ReservaApp</h1>
<div class="flex gap-2">
<button class="btn" onclick="redir('cliente')">Soy Cliente</button>
<button class="btn" onclick="redir('local')">Soy Local</button>
</div>
</header>
<section class="p-6">
<h2 class="text-2xl font-bold mb-3">Locales destacados</h2>
<div class="slider" id="sliderLocales">
<div class="track" id="trackLocales"></div>
</div>
</section>

<section class="p-6 bg-white">
<h2 class="text-2xl font-bold mb-3">Clientes felices</h2>
<div class="slider" id="sliderClientes">
<div class="track" id="trackClientes"></div>
</div>
</section>

<section class="p-6">
<h2 class="text-2xl font-bold mb-3">Cómo funciona</h2>
<div class="slider" id="sliderComo">
<div class="track">
<div class="slide"><div class="p-4 bg-white rounded-xl shadow">1. Buscá tu local</div></div>
<div class="slide"><div class="p-4 bg-white rounded-xl shadow">2. Elegí servicio y horario</div></div>
<div class="slide"><div class="p-4 bg-white rounded-xl shadow">3. Confirmá tu reserva</div></div>
</div>
</div>
</section>

  <section class="p-6 bg-white">
<h2 class="text-2xl font-bold mb-3">Selecciona tu plan</h2>
<div id="planesContainer" class="grid md:grid-cols-3 gap-4"></div>
</section>

<section class="p-6">
<h2 class="text-2xl font-bold mb-3">Locales Premium</h2>
<div id="premiumContainer" class="grid md:grid-cols-3 gap-4"></div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH_DOMAIN",
  projectId: "TU_PROJECT_ID"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.redir = (tipo, plan="") => {
  if(tipo==="local"){
    window.location.href = `local.html?src=landing&plan=${plan}`;
  } else {
    window.location.href = `cliente.html?src=landing&plan=${plan}`;
  }
};

  
  async function renderPlanes(){
  const cont = document.getElementById("planesContainer");
  try {
    const snap = await getDoc(doc(db, "config", "planes"));
    if(!snap.exists()){ cont.innerHTML = "No hay planes configurados"; return; }
    const lista = snap.data().lista || [];
    cont.innerHTML = lista.map(p => `
      <div class="p-4 bg-gray-50 rounded-xl shadow">
        <h3 class="font-bold text-lg">${p.nombre}</h3>
        <p class="text-2xl font-bold my-2">$${p.precio}</p>
        <p class="text-sm text-gray-600 mb-3">${p.desc}</p>
        <button class="btn w-full" onclick="redir('local','${p.nombre}')">Elegir ${p.nombre}</button>
      </div>
    `).join("");
  } catch(e){ cont.innerHTML = "Error cargando planes: "+e.message; }
}

async function renderPremium(){
  const cont = document.getElementById("premiumContainer");
  try {
    const q = query(collection(db, "locales"), where("premium","==",true));
    const snap = await getDocs(q);
    if(snap.empty){ cont.innerHTML = "Aún no hay locales premium"; return; }
    let html = "";
    snap.forEach(d => {
      const l = d.data();
      if(l.activo === false) return;
      html += `
        <div class="p-4 bg-white rounded-xl shadow">
          <img src="${l.foto || l.logo || ''}" class="w-full h-40 object-cover rounded-lg mb-2">
          <h3 class="font-bold">${l.nombre || 'Local'}</h3>
        </div>
      `;
    });
    cont.innerHTML = html || "Aún no hay locales premium";
  } catch(e){ cont.innerHTML = "Error premium: "+e.message; }
}

function initSliders(){
  document.querySelectorAll(".slider").forEach(slider => {
    const track = slider.querySelectorAll(".track")[0];
    const slides = slider.querySelectorAll(".slide");
    if(!track || slides.length===0) return;
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % slides.length;
      track.style.transform = `translateX(-${idx * 100}%)`;
    }, 3000);
  });
}

function renderLocalesDemo(){
  const t = document.getElementById("trackLocales");
  if(t) t.innerHTML = `<div class="slide">Demo locales cargará desde Firebase</div>`;
}
function renderClientesDemo(){
  const t = document.getElementById("trackClientes");
  if(t) t.innerHTML = `<div class="slide">Demo clientes</div>`;
}

renderPlanes();
renderPremium();
renderLocalesDemo();
renderClientesDemo();
initSliders();
</script>
</body>
</html>
