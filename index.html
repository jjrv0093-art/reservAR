<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserva YA</title>
<style>
:root{--v:#6c2cff;--bg:#0b0b12;--card:#151525}
body{margin:0;font-family:system-ui;background:var(--bg);color:#fff}
.wrap{max-width:1100px;margin:auto;padding:16px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card-locales,.card-clientes{background:var(--card);border-radius:16px;padding:16px}
.card-locales .btn-card{width:100%;padding:12px;border-radius:12px;border:0;background:#fff;color:#111;font-weight:700;cursor:pointer}
.card-clientes .btn-card{width:100%;padding:12px;border-radius:12px;border:0;background:var(--v);color:#fff;font-weight:700;cursor:pointer}
.img-wrap{position:relative;height:200px;overflow:hidden;border-radius:12px}
.img-wrap .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:.5s}
.img-wrap .slide.active{opacity:1}
.como{margin-top:32px}
.como-carousel{position:relative;height:220px;overflow:hidden;border-radius:12px}
.como-carousel .c-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:.5s}
.como-carousel .c-slide.active{opacity:1}
.video-box-real{display:none;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.video-box-real.on{display:grid}
.video-box-real video{width:100%;border-radius:12px;background:#000}
</style>
</head>
<body>
<div class="wrap">
<div class="cards">
<div class="card-locales">
<div class="img-wrap" id="wrap-locales"></div>
<h3>Para Locales</h3>
<button class="btn-card" onclick="redir('local','base')">Soy Local</button>
</div>
<div class="card-clientes">
<div class="img-wrap" id="wrap-clientes"></div>
<h3>Para Clientes</h3>
<button class="btn-card" onclick="redir('cliente','')">Soy Cliente</button>
</div>
</div>
<div class="como">
<h2>Como Funciona</h2>
<div id="como-carousel-box"><div class="como-carousel" id="como-carousel"></div></div>
<div class="video-box-real" id="video-box-real">
<div><video id="v-local" muted loop playsinline controls></video></div>
<div><video id="v-cliente" muted loop playsinline controls></video></div>
</div>
</div>
<div id="planes-box"></div>
<div id="premium-box"></div>
<div id="contacto-box"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "TU_APIKEY", authDomain: "TU_DOMINIO", projectId: "TU_PROJECT_ID" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let iv1=null,iv2=null,iv3=null;
function redir(tipo,plan){
 if(tipo==='local'){location.href=`./local.html?src=landing&plan=${encodeURIComponent(plan||'base')}`;}
 else{location.href=`./cliente.html?src=landing`;}
}
window.redir=redir;
function initSliders(){
 clearInterval(iv1);clearInterval(iv2);clearInterval(iv3);
 const s1=document.querySelectorAll('#wrap-locales .slide');
 const s2=document.querySelectorAll('#wrap-clientes .slide');
 const s3=document.querySelectorAll('#como-carousel .c-slide');
 let i1=0,i2=0,i3=0;
 if(s1.length){s1[0].classList.add('active');iv1=setInterval(()=>{s1[i1].classList.remove('active');i1=(i1+1)%s1.length;s1[i1].classList.add('active');},3000);}
 if(s2.length){s2[0].classList.add('active');iv2=setInterval(()=>{s2[i2].classList.remove('active');i2=(i2+1)%s2.length;s2[i2].classList.add('active');},3000);}
 if(s3.length){s3[0].classList.add('active');iv3=setInterval(()=>{s3[i3].classList.remove('active');i3=(i3+1)%s3.length;s3[i3].classList.add('active');},3000);}
}
  async function loadLanding(){
 const snap=await getDoc(doc(db,'config','landing'));
 const d=snap.exists()?snap.data():{};
 document.getElementById('wrap-locales').innerHTML=(d.galeriaLocales||[]).map(u=>`<img class="slide" src="${u}">`).join('');
 document.getElementById('wrap-clientes').innerHTML=(d.galeriaClientes||[]).map(u=>`<img class="slide" src="${u}">`).join('');
 document.getElementById('como-carousel').innerHTML=(d.galeriaComo||d.galeriaLocales||[]).map(u=>`<img class="c-slide" src="${u}">`).join('');
 const vL=d.videoLocalUrl||'';const vC=d.videoClienteUrl||'';
 const boxReal=document.getElementById('video-box-real');
 const boxCar=document.getElementById('como-carousel-box');
 if(vL||vC){
  if(vL)document.getElementById('v-local').src=vL;
  if(vC)document.getElementById('v-cliente').src=vC;
  boxReal.classList.add('on');boxCar.style.display='none';
 }else{boxReal.classList.remove('on');boxCar.style.display='block';}
 initSliders();loadPlanes();loadPremium();loadContacto();
}
async function loadPlanes(){
 const s=await getDoc(doc(db,'config','planes'));
 let lista=s.exists()&&s.data().lista?s.data().lista:[
  {id:'base',nombre:'Base',tachado:100,precio:50,cupo:'38/50'},
  {id:'medio',nombre:'Medio',tachado:100,precio:50,cupo:'38/50'},
  {id:'premium',nombre:'Premium',tachado:100,precio:50,cupo:'38/50'}
 ];
 document.getElementById('planes-box').innerHTML=lista.map(p=>`<div><span style="text-decoration:line-through">$${p.tachado}</span> <b>$${p.precio}</b> ${p.nombre} <button onclick="redir('local','${p.id}')">Elegir</button></div>`).join('');
}
async function loadPremium(){
 try{
  const qRef=query(collection(db,'locales'),where('plan','==','premium'),where('activo','==',true));
  const snap=await getDocs(qRef);
  if(snap.empty){document.getElementById('premium-box').innerHTML='';return;}
  let h='';snap.forEach(docu=>{h+=`<div onclick="location.href='./cliente.html?local=${docu.id}&src=landing'">${docu.data().nombre||'Local'}</div>`;});
  document.getElementById('premium-box').innerHTML=h;
 }catch(e){}
}
async function loadContacto(){
 const s=await getDoc(doc(db,'config','cobros'));
 const d=s.exists()?s.data():{};
 document.getElementById('contacto-box').innerHTML=`<div>${d.whatsapp?`<a href="https://wa.me/${d.whatsapp}">${d.whatsapp}</a>`:''} ${d.email?`<span>${d.email}</span>`:''}</div>`;
}
loadLanding();
</script>
</body>
</html>
